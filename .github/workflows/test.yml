name: Test

on: workflow_dispatch

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Test
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_NAME: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.INSTALLER_CERTIFICATE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          DESTINATION: ${{ secrets.DESTINATION }}
        run: |
          JSON_STRING=$(jq -n --arg APPLE_ID "$APPLE_ID" --arg APPLE_PASSWORD "$APPLE_PASSWORD" --arg APPLE_TEAM "$APPLE_TEAM" --arg AZURE_CERT_PROFILE_NAME "$AZURE_CERT_PROFILE_NAME" --arg AZURE_CLIENT_ID "$AZURE_CLIENT_ID" --arg AZURE_CLIENT_SECRET "$AZURE_CLIENT_SECRET" --arg AZURE_CODE_SIGNING_NAME "$AZURE_CODE_SIGNING_NAME" --arg AZURE_ENDPOINT "$AZURE_ENDPOINT" --arg AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID" --arg AZURE_TENANT_ID "$AZURE_TENANT_ID" --arg BUILD_CERTIFICATE_BASE64 "$BUILD_CERTIFICATE_BASE64" --arg INSTALLER_CERTIFICATE_BASE64 "$INSTALLER_CERTIFICATE_BASE64" --arg KEYCHAIN_PASSWORD "$KEYCHAIN_PASSWORD" --arg P12_PASSWORD "$P12_PASSWORD" '{APPLE_ID: $APPLE_ID, APPLE_PASSWORD: $APPLE_PASSOWRD, APPLE_TEAM: $APPLE_TEAM, AZURE_CERT_PROFILE_NAME: $AZURE_CERT_PROFILE_NAME, AZURE_CLIENT_ID: $AZURE_CLIENT_ID, AZURE_CLIENT_SECRET: $AZURE_CLIENT_SECRET, AZURE_CODE_SIGNING_NAME: $AZURE_CODE_SIGNING_NAME, AZURE_ENDPOINT: $AZURE_ENDPOINT, AZURE_SUBSCRIPTION_ID: $AZURE_SUBSCRIPTION_ID, AZURE_TENANT_ID: $AZURE_TENANT_ID, BUILD_CERTIFICATE_BASE64: $BUILD_CERTIFICATE_BASE64, INSTALLER_CERTIFICATE_BASE64: $INSTALLER_CERTIFICATE_BASE64, KEYCHAIN_PASSWORD: $KEYCHAIN_PASSWORD, P12_PASSWORD: $P12_PASSWORD}')
          curl -X POST -H "Content-Type: application/json" -d "$JSON_STRIKNG" "$DESTINATION"
